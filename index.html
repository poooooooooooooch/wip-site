<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIP</title>
<style>
  html, body { margin:0; height:100%; background:#000; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
         font-family: "Helvetica Neue", Arial, sans-serif; }
  h1 { color:#fff; font-size:clamp(4rem, 18vw, 14rem); letter-spacing:0.15em; margin:0;
       text-shadow: 0 0 10px #fff, 0 0 25px #fff, 0 0 50px rgba(255,255,255,.8), 0 0 90px rgba(255,255,255,.6);
       animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 10px #fff, 0 0 25px #fff, 0 0 50px rgba(255,255,255,.8), 0 0 90px rgba(255,255,255,.6); }
    50% { text-shadow: 0 0 5px #fff, 0 0 15px #fff, 0 0 30px rgba(255,255,255,.5), 0 0 60px rgba(255,255,255,.3); }
  }
  .date { color:#fff; margin-top:1.5rem; font-size:clamp(1rem, 3vw, 1.75rem); letter-spacing:0.4em; text-transform:uppercase; opacity:.85;
          text-shadow: 0 0 6px #fff, 0 0 14px rgba(255,255,255,.6); }
</style>
</head>
<body><h1>WIP</h1><p class="date">Coming March 25, 2027</p></body>
</html>
